# ============================================================================
# dsh-doubao-painter —— DSH bundle patch
# ============================================================================
# 插件挂载声明：DSH 启动时把本插件插进 profile 的配置树。
#
# 安装（本地开发，link 到源码目录）：
#   dsh plugin --profile <profile> add "link:<项目根>/plugins/dsh-doubao-painter"
# 装完确认包名进了 profiles/<profile>/package.json 的 dsh.profile.bundles，
# 重启 DSH 生效。
#
# 注意：`name:` 必须与安装后的包名完全一致（这里是 dsh-doubao-painter）。
# ============================================================================

- insert:
    - id: dsh-doubao-painter
      name: dsh-doubao-painter
      config:
        enabled: true
        # 无头浏览器的 CDP 调试端口（插件用 --remote-debugging-port 拉起它）
        cdpPort: 9225
        # 浏览器主程序。任何 Chromium 内核的都行：Chrome、Edge、豆包客户端本身。
        # 下面这个是 Windows 上 Edge 的默认位置，按自己机器改
        appExe: 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
        # 单张图等待上限（毫秒）；正常 20~90 秒
        timeoutMs: 180000
        # 每个任务开新对话，别把用户正在聊的会话弄乱
        newChatPerTask: true
        # 复用同一个固定会话（默认 true）：所有出图都在同一个对话里，不会把列表堆满
        reuseSession: true
        # 图片默认落在会话工作区的这个子目录。
        # 名字必须是 doubao-images —— dsh-webchat 按这个名字扫图并插进聊天
        outSubdir: doubao-images
        # 归档用的项目名。默认空 = 不归档：
        #   出图都在一个会话里跑，对话列表不会乱，也就不需要拖进项目了。
        # 想让 DSH 的对话单独归类就填个项目名（插件会自动建）
        projectName: ''
