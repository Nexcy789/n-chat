<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>连接</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0e14;--panel:#141923;--line:rgba(255,255,255,.09);--text:#e9eef7;--dim:#94a0b3;--accent:#7c8cff}
html[data-scheme="light"]{--bg:#f3f5f9;--panel:#fff;--line:rgba(17,24,39,.09);--text:#131a26;--dim:#5a6472;--accent:#4f63d2}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:"Segoe UI","Microsoft YaHei UI",-apple-system,system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:24px 24px calc(24px + var(--nav-inset,0px));
  -webkit-font-smoothing:antialiased;
}
.card{width:100%;max-width:380px}
.logo{
  width:64px;height:64px;border-radius:20px;margin:0 auto 22px;
  background:linear-gradient(140deg,#5b6ee1,#8a5be1);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:600;color:#fff;
  box-shadow:0 10px 30px rgba(91,110,225,.35);
}
h1{font-size:19px;font-weight:600;text-align:center;margin-bottom:6px}
.sub{font-size:13px;color:var(--dim);text-align:center;margin-bottom:26px;line-height:1.6}
label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:8px}
input{
  width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);font-size:15px;font-family:inherit;
  outline:none;transition:border-color .15s;
}
input:focus{border-color:var(--accent)}
button{
  width:100%;margin-top:14px;padding:14px;border-radius:12px;border:none;
  background:var(--accent);color:#fff;font-size:15px;font-weight:500;
  font-family:inherit;cursor:pointer;transition:opacity .15s;
}
button:active{opacity:.8}
.hint{font-size:11.5px;color:#5a6673;margin-top:16px;line-height:1.7;text-align:center}
.err{color:#f07070;font-size:12.5px;margin-top:12px;text-align:center;min-height:18px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">群</div>
  <h1>N-chat</h1>
  <div class="sub">连到电脑上跑着的聊天服务</div>

  <label>服务器地址</label>
  <input id="addr" placeholder="192.168.1.10:4200" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="go">进入</button>
  <div class="err" id="err"></div>
  <div class="hint">
    手机和电脑连同一个 Wi-Fi，填电脑的局域网地址<br>
    端口默认 4200，在电脑上跑 <b>ipconfig</b> 能看到<br>
    不在同一网段？用 Tailscale 这类组网工具，填它给的地址
  </div>
</div>
<script>
// 明暗跟系统走：状态栏颜色也一起交给原生
var dark = true
try {
  dark = (window.NChat && NChat.systemDark) ? !!Number(NChat.systemDark())
    : !window.matchMedia('(prefers-color-scheme: light)').matches
} catch (e) {}
document.documentElement.setAttribute('data-scheme', dark ? 'dark' : 'light')
try { if (window.NChat && NChat.setTheme) NChat.setTheme(dark ? 'dark' : 'light', dark ? '#0b0e14' : '#f3f5f9') } catch (e) {}

var DEFAULT = ''
var APP = 'http://nchat.local/app/'
var input = document.getElementById('addr')
var err = document.getElementById('err')

function norm(v) {
  v = (v || '').trim()
  if (v === '') return ''
  if (!/^https?:\/\//i.test(v)) v = 'http://' + v
  return v.replace(/\/+$/, '')
}

var saved = localStorage.getItem('dsh_group_server')
if (saved) {
  // 有存过的地址就直接进聊天页，省得每次都要点。
  // 顺手补一枪给原生层：清过应用数据时 SharedPreferences 可能已经没了。
  try { if (window.NChat) NChat.saveServer(saved) } catch (e) {}
  location.replace(APP)
} else {
  input.value = DEFAULT
  input.select()
}

document.getElementById('go').onclick = function () {
  var url = norm(input.value)
  if (url === '') { err.textContent = '先填个地址'; return }
  err.textContent = '正在连接…'
  localStorage.setItem('dsh_group_server', url)
  // 告诉原生层服务器地址：接口打哪儿、常驻服务往哪轮询，都靠它
  try { if (window.NChat) NChat.saveServer(url.replace(/^https?:\/\//, 'http://')) } catch (e) {}
  location.replace(APP)
}

input.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') document.getElementById('go').click()
})

// 长按标题清掉记住的地址，换服务器用
document.querySelector('h1').addEventListener('longpress', function () {
  localStorage.removeItem('dsh_group_server')
  err.textContent = '已清除'
})
var pressTimer
document.querySelector('h1').addEventListener('touchstart', function () {
  pressTimer = setTimeout(function () {
    localStorage.removeItem('dsh_group_server')
    err.textContent = '已清除记住的地址'
  }, 900)
})
document.querySelector('h1').addEventListener('touchend', function () { clearTimeout(pressTimer) })
</script>
</body>
</html>
